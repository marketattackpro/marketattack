name: Vigilancia externa

# Revisa el sitio desde internet cada 10 minutos. Si no responde,
# abre un aviso (y GitHub te manda correo). Al volver, lo cierra solo.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vigilancia-externa
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revisar el sitio desde internet
        id: revision
        run: |
          ok="no"
          codigo="000"
          for intento in 1 2 3; do
            codigo=$(curl -sS -L -o /tmp/pagina.html -w "%{http_code}" --max-time 20 "https://marketattack.duckdns.org/" 2>/dev/null || echo "000")
            if [ "$codigo" = "200" ] && grep -qi "marketattack" /tmp/pagina.html; then
              ok="si"
              break
            fi
            sleep 20
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "Resultado: ok=$ok código=$codigo"

      - name: Abrir aviso si está caído
        if: steps.revision.outputs.ok == 'no'
        uses: actions/github-script@v7
        env:
          CODIGO: ${{ steps.revision.outputs.codigo }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const abiertos = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "caida"
            });
            if (abiertos.data.length > 0) {
              core.info("Ya hay un aviso abierto; no se duplica.");
              return;
            }
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: "caida", color: "d73a4a",
                description: "El sitio no responde"
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }
            const cuerpo = [
              "El chequeo automático desde internet no pudo abrir el sitio.",
              "",
              `- Hora (UTC): ${new Date().toISOString()}`,
              `- Código HTTP: ${process.env.CODIGO}`,
              "- URL: https://marketattack.duckdns.org/",
              "",
              "Si el servidor está caído del todo, este aviso es la señal.",
              "Al volver, se cierra solo."
            ].join("\n");
            await github.rest.issues.create({
              owner, repo,
              title: "🚨 MARKETATTACK no responde",
              body: cuerpo,
              labels: ["caida"]
            });

      - name: Cerrar el aviso al volver
        if: steps.revision.outputs.ok == 'si'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const abiertos = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "caida"
            });
            for (const issue of abiertos.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: "✅ El sitio volvió a responder. Se cierra el aviso."
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: "closed"
              });
            }
