server {
    server_name 157-137-203-223.sslip.io;

    root /var/www/marketattack;
    index index.html;
    autoindex off;
    charset utf-8;

    # 404 REAL: si el archivo no existe, no inventamos la portada

    # ── chat con IA (backend local, no expuesto) ──
    location ^~ /api/chat {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|woff2|ico)$ {
        expires 7d;
    }

    error_page 404 /no-existe.html;
    location = /no-existe.html {
        internal;
        return 404 "404 - esta pagina no existe";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/157-137-203-223.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/157-137-203-223.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 157-137-203-223.sslip.io _;

    root /var/www/marketattack;
    index index.html;
    autoindex off;
    charset utf-8;

    # El dominio siempre va a HTTPS; cualquier otro Host (127.0.0.1) sirve el sitio
    if ($host = 157-137-203-223.sslip.io) {
        return 301 https://$host$request_uri;
    }


    # ── chat con IA (backend local, no expuesto) ──
    location ^~ /api/chat {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(css|js|png|jpg|jpeg|svg|woff2|ico)$ {
        expires 7d;
    }
}
